spring.data.mongodb.uri=mongodb://localhost:27017/metaphoenix
server.port=8081

# Redis is optional for the current web/API workflow.
redis.enabled=false
management.health.redis.enabled=false
spring.data.redis.database=1
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Local workspace for imports, exports, reports, and external data files.
repository=/path/to/metaphoenix-data

# Optional. Required only for Sirius-based decoy generation.
siriusPath=/path/to/sirius
siriusProjectSpace=/path/to/metaphoenix-data/sirius

# Enable only for interactive command-line mode.
command.runner.enabled=false
