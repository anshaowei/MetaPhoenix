spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/metaphoenix}
#spring.data.mongodb.uri=mongodb://localhost:27017/mslibrary-small
#spring.data.mongodb.uri=mongodb://192.168.1.181:27017/mslibrary
spring.data.mongodb.auto-index-creation=true
server.port=${SERVER_PORT:8081}
spring.data.redis.database=${REDIS_DATABASE:1}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
command.runner.enabled=false
#logging.file.name=D://metabolomics/logs/mslibrary.log
logging.charset.file=UTF-8

repository=${METAPHOENIX_REPOSITORY:${user.home}/metaphoenix-data}

#Sirius
siriusPath=${SIRIUS_PATH:}
siriusProjectSpace=${SIRIUS_PROJECT_SPACE:${repository}/sirius}

server.compression.enabled=true
server.compression.min-response-size=2048
spring.main.allow-circular-references=true
